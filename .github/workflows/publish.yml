name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Build and publish @shmaplex/xplant-sdk
    runs-on: ubuntu-latest

    permissions:
      contents: write  # create GitHub Release
      id-token: write  # OIDC trusted publishing — no stored npm token needed

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Tokenless trusted publishing needs npm 11.5.1+. Node 20 ships npm 10,
      # which would fall back to a stored token and fail without one.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
